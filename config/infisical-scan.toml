# Default scan config for the Infisical Claude Code plugin.
#
# To use your own rules instead, put a config at ~/.claude/plugins/data/infisical-secret-scanner-infisical/infisical-scan.toml.
# Start it with the [extend] block below to keep the default rules.

title = "Infisical Claude Code plugin"

[extend]
useDefault = true

# Values that are clearly placeholders, not secrets, are common in prompts.
[[allowlists]]
description = "Placeholder values"
regexTarget = "secret"
regexes = [
  '''^<[^<>]+>$''',
  '''(?i)^(?:your|my)[-_ ]''',
  '''(?i)(?:example|placeholder|changeme|redacted)''',
]
